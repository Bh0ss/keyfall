<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Keyfall</title>
    <meta http-equiv="refresh" content="0; url=/keyfall/" />
    <script>
      // Keyfall routes with the URL hash, so any unknown path just goes back to the app.
      location.replace('/keyfall/' + location.search + location.hash);
    </script>
  </head>
  <body>
    <p><a href="/keyfall/">Open Keyfall</a></p>
  </body>
</html>
